name: Build debug APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch makes an in-flight build pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk is 36.1 (minor API level 1), which needs its own platform package
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 platforms;android-36 build-tools;36.1.0'

      # The debug signing config points at ${rootDir}/debug.keystore, which is gitignored.
      # Keeping the key in a secret means every build signs with the same key, so a new APK
      # installs over the previous one instead of failing on a signature mismatch.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Signing with the debug keystore from repository secrets."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set. Generating a throwaway key - APKs from different runs will NOT install over each other, and reinstalling wipes app data."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # This repo has no gradle wrapper checked in, so Gradle is installed by the action.
      # If the build fails on a minimum-version check, bump gradle-version to what AGP asks for.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: numbawang-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
